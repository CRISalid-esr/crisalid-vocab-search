name: CD Push API (dev-main)

on:
  push:
    branches:
      - 'dev-main'
    paths:
      - '**'
      - '!.github/workflows/**'
      - '.github/workflows/cd_push_api_container.yaml'
  workflow_dispatch:

env:
  DOCKERHUB_REPO: crisalidesr/crisalid-vocab-search
  DEV_LINE: 1.2 # bump manually when you move the dev line

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ env.DOCKERHUB_REPO }}:api-${{ env.DEV_LINE }}-dev
            ${{ env.DOCKERHUB_REPO }}:api-dev
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
