name: CD Push vocab container

on:
  push:
    branches: [ dev-main ]
    paths:
      - 'os-vocabs/**'
      - '.github/workflows/cd_push_os.yaml'
  workflow_dispatch:

env:
  DOCKERHUB_REPO: crisalidesr/crisalid-vocab-search
  PLATFORMS: linux/amd64,linux/arm64
  DEV_LINE: 1.1 # bump manually when you move the dev line

jobs:
  build-and-push-os:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Build & push the single multi-vocabulary OpenSearch image ---
      - name: Build & push OS image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: os-vocabs/docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_BRANCH=${{ github.ref_name }}
          tags: |
            ${{ env.DOCKERHUB_REPO }}:os-${{ env.DEV_LINE }}-dev
            ${{ env.DOCKERHUB_REPO }}:os-dev
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.ref.name=${{ github.ref_name }}
          cache-from: type=registry,ref=${{ env.DOCKERHUB_REPO }}:os-buildcache
          cache-to: type=registry,ref=${{ env.DOCKERHUB_REPO }}:os-buildcache,mode=max
          provenance: false
