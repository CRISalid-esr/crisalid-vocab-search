# Docker: single OpenSearch service 'os' embedding all vocabularies,
# one index per vocabulary (alias concepts_<identifier>).
vocabularies:
  - identifier: jel
    type: local_os
    config:
      host: http://os
      port: 9200

  - identifier: acm
    type: local_os
    config:
      host: http://os
      port: 9200

  - identifier: aat
    type: local_os
    config:
      host: http://os
      port: 9200

  - identifier: elsst
    type: local_os
    config:
      host: http://os
      port: 9200

  - identifier: pactols
    type: local_os
    config:
      host: http://os
      port: 9200

  - identifier: euroscivoc
    type: local_os
    config:
      host: http://os
      port: 9200
